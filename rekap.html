<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai Siswa</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">

  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif !important;
      background-color: var(--bg-main) !important;
      color: var(--text-main);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-wrapper {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 220px;
    }

    .filter-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .filter-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      transition: all 0.3s;
    }

    .filter-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge-score {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }

    .score-high { background: #dcfce7; color: #059669; }
    .score-mid { background: #fef3c7; color: #d97706; }
    .score-low { background: #fee2e2; color: #dc2626; }

    .btn-detail {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }

    .btn-detail:hover {
      background: #4338ca;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div id="sidebar-container"></div>
  <div class="main">
    <div id="header-container"></div>
    <div class="card">
      <div class="page-title" id="pageTitleText">📊 Rekap Nilai & Hasil Latihan</div>

      <!-- Filter Latihan (Hanya tampil untuk Guru/Admin) -->
      <div class="filter-wrapper" id="teacherFilterSection" style="display: none;">
        <div class="filter-group">
          <label>Pilih Latihan / Tugas</label>
          <select id="filterExercise" onchange="loadTeacherSubmissions()">
            <option value="">-- Pilih Latihan Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <!-- Tabel Rekap -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th id="thNamaSiswa">Nama Siswa</th>
              <th>Judul Latihan</th>
              <th>Waktu Pengumpulan</th>
              <th>Benar / Total</th>
              <th>Skor Akhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="submissionTableBody">
            <tr>
              <td colspan="7" class="empty-state">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Script Gabungan Dinamis (Guru & Siswa) -->
<script type="module">
  import { auth, db } from "./firebase/firebase-config.js";
  import {
    collection,
    getDocs,
    getDoc,
    doc,
    query,
    where
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { loadLayout } from "./assets/js/components.js";

  let currentUserData = null;
  let currentUserId = null;

  onAuthStateChanged(auth, async (user) => {
    if (!user) return window.location = "./login.html";

    currentUserId = user.uid;
    const userSnap = await getDoc(doc(db, "users", currentUserId));
    if (!userSnap.exists()) return;

    currentUserData = userSnap.data();
    const role = currentUserData.role;

    // Muat layout sesuai role
    if (role === "guru" || role === "admin") {
      await loadLayout("guru");
      document.getElementById("teacherFilterSection").style.display = "flex";
      document.getElementById("thNamaSiswa").style.display = "table-cell";
      document.getElementById("submissionTableBody").innerHTML = `
        <tr><td colspan="7" class="empty-state">Silakan pilih latihan di atas untuk melihat rekap nilai.</td></tr>
      `;
      await loadExerciseDropdown(currentUserData.schoolId);
    } else {
      // Jika Siswa
      await loadLayout("siswa");
      document.getElementById("teacherFilterSection").style.display = "none";
      document.getElementById("pageTitleText").innerHTML = "📈 Riwayat Nilai & Latihan Saya";
      await loadStudentSubmissions(currentUserId);
    }
  });

  // --- FUNGSI UNTUK GURU / ADMIN ---
  async function loadExerciseDropdown(schoolId) {
    const select = document.getElementById("filterExercise");
    try {
      const q = query(collection(db, "exercises"), where("schoolId", "==", schoolId));
      const snap = await getDocs(q);
      
      snap.forEach(d => {
        const ex = d.data();
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = ex.title || "Latihan Tanpa Judul";
        select.appendChild(opt);
      });
    } catch (err) {
      console.error("Gagal memuat daftar latihan:", err);
    }
  }

  window.loadTeacherSubmissions = async () => {
    const exerciseId = document.getElementById("filterExercise").value;
    const tbody = document.getElementById("submissionTableBody");
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Memuat data...</td></tr>`;

    if (!exerciseId) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Silakan pilih latihan di atas untuk melihat rekap nilai.</td></tr>`;
      return;
    }

    try {
      const q = query(collection(db, "student_submissions"), where("exerciseId", "==", exerciseId));
      const snap = await getDocs(q);

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Belum ada siswa yang mengumpulkan tugas ini.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      let no = 1;

      for (const d of snap.docs) {
        const sub = d.data();
        
        let studentName = "Siswa (Tidak Dikenal)";
        const studentSnap = await getDoc(doc(db, "users", sub.studentUid));
        if (studentSnap.exists()) {
          studentName = studentSnap.data().name || "Siswa";
        }

        let exerciseTitle = "-";
        const exSnap = await getDoc(doc(db, "exercises", sub.exerciseId));
        if (exSnap.exists()) {
          exerciseTitle = exSnap.data().title || "-";
        }

        let formattedDate = "-";
        if (sub.submittedAt?.toDate) {
          formattedDate = sub.submittedAt.toDate().toLocaleString('id-ID', {
            dateStyle: 'medium',
            timeStyle: 'short'
          });
        }

        let scoreClass = "score-low";
        if (sub.score >= 75) scoreClass = "score-high";
        else if (sub.score >= 50) scoreClass = "score-mid";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${no++}</td>
          <td><strong>${studentName}</strong></td>
          <td>${exerciseTitle}</td>
          <td>${formattedDate}</td>
          <td>${sub.correctAnswers || 0} / ${sub.totalQuestions || 0}</td>
          <td><span class="badge-score ${scoreClass}">${sub.score}</span></td>
          <td><button class="btn-detail" onclick='alert("Skor ${studentName}: ${sub.score} (${sub.correctAnswers}/${sub.totalQuestions} benar)")'>🔍 Detail</button></td>
        `;
        tbody.appendChild(tr);
      }
    } catch (err) {
      console.error("Gagal memuat rekap nilai:", err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:red;">Gagal memuat data dari database.</td></tr>`;
    }
  };

  // --- FUNGSI UNTUK SISWA ---
  async function loadStudentSubmissions(studentUid) {
    const tbody = document.getElementById("submissionTableBody");
    tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Memuat riwayat nilai Anda...</td></tr>`;

    try {
      const q = query(collection(db, "student_submissions"), where("studentUid", "==", studentUid));
      const snap = await getDocs(q);

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Anda belum pernah menyelesaikan latihan apa pun.</td></tr>`;
        return;
      }

      tbody.innerHTML = "";
      let no = 1;

      for (const d of snap.docs) {
        const sub = d.data();

        let exerciseTitle = "Latihan";
        const exSnap = await getDoc(doc(db, "exercises", sub.exerciseId));
        if (exSnap.exists()) {
          exerciseTitle = exSnap.data().title || "Latihan";
        }

        let formattedDate = "-";
        if (sub.submittedAt?.toDate) {
          formattedDate = sub.submittedAt.toDate().toLocaleString('id-ID', {
            dateStyle: 'medium',
            timeStyle: 'short'
          });
        }

        let scoreClass = "score-low";
        if (sub.score >= 75) scoreClass = "score-high";
        else if (sub.score >= 50) scoreClass = "score-mid";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${no++}</td>
          <td style="display:none;">-</td>
          <td><strong>${exerciseTitle}</strong></td>
          <td>${formattedDate}</td>
          <td>${sub.correctAnswers || 0} / ${sub.totalQuestions || 0}</td>
          <td><span class="badge-score ${scoreClass}">${sub.score}</span></td>
          <td><button class="btn-detail" onclick='alert("Skor Anda: ${sub.score}\\nJawaban Benar: ${sub.correctAnswers} dari ${sub.totalQuestions} soal")'>🔍 Detail</button></td>
        `;
        tbody.appendChild(tr);
      }
    } catch (err) {
      console.error("Gagal memuat riwayat siswa:", err);
      tbody.innerHTML = `<tr><td colspan="7" class="empty-state" style="color:red;">Gagal memuat riwayat nilai.</td></tr>`;
    }
  }
</script>

</body>
</html>
