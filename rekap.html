<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekap Nilai Siswa</title>

  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

  <style>
    :root {
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    body {
      font-family: 'Inter', sans-serif !important;
      background-color: var(--bg-main) !important;
      color: var(--text-main);
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Filter & Select Style */
    .filter-wrapper {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .filter-group {
      flex: 1;
      min-width: 220px;
    }

    .filter-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .filter-group select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background-color: #fff;
      transition: all 0.3s;
    }

    .filter-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
    }

    /* Table Style */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: #f1f5f9;
      font-weight: 700;
      color: #334155;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge-score {
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 13px;
    }

    .score-high { background: #dcfce7; color: #059669; }
    .score-mid { background: #fef3c7; color: #d97706; }
    .score-low { background: #fee2e2; color: #dc2626; }

    .btn-detail {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: background 0.2s;
    }

    .btn-detail:hover {
      background: #4338ca;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

<div class="wrapper">
  <div id="sidebar-container"></div>
  <div class="main">
    <div id="header-container"></div>
    <div class="card">
      <div class="page-title">📊 Rekap Nilai & Hasil Latihan Siswa</div>

      <!-- Filter Latihan -->
      <div class="filter-wrapper">
        <div class="filter-group">
          <label>Pilih Latihan / Tugas</label>
          <select id="filterExercise" onchange="loadSubmissions()">
            <option value="">-- Pilih Latihan Terlebih Dahulu --</option>
          </select>
        </div>
      </div>

      <!-- Tabel Rekap -->
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Nama Siswa</th>
              <th>Waktu Pengumpulan</th>
              <th>Benar / Total</th>
              <th>Skor Akhir</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="submissionTableBody">
            <tr>
              <td colspan="6" class="empty-state">Silakan pilih latihan di atas untuk melihat rekap nilai.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module" src="./rekap-nilai.js"></script>

</body>
</html>
