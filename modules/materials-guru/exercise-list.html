<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Daftar Latihan</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

  <style>
    /* Memastikan body, wrapper, dan main mengizinkan scrolling vertikal */
    html, body {
      height: 100%;
      margin: 0;
      overflow-y: auto !important;
    }
    .wrapper {
      min-height: 100vh;
      display: flex;
    }
    .main {
      flex: 1;
      overflow-y: auto !important;
      max-height: 100vh;
    }
  </style>
</head>
<body>

<div class="wrapper">

  <div id="sidebar-container"></div>

  <div class="main">

    <div id="header-container"></div>

    <div class="card">
      <h2 id="titlePage">Daftar Latihan</h2>

      <div id="exerciseList"></div>
    </div>

  </div>
</div>

<script type="module" src="exercise-list.js"></script>

</body>
</html>
