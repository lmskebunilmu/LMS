<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi Guru</title>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="../../assets/css/responsive.css">

  <style>
    .card {
      box-sizing: border-box;
    }
    .module-container {
      max-height: 65vh;
      min-height: 350px;
      overflow-y: auto;
      border: 1px solid #e0e0e0;
      padding: 15px;
      border-radius: 6px;
      background: #fff;
    }
    @media (max-width: 768px) {
      .action-buttons, .grid-2 {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .action-buttons button {
        margin-left: 0 !important;
        width: 100%;
      }
    }
  </style>
</head>

<body>
<div class="wrapper">

  <!-- SIDEBAR -->
  <div id="sidebar-container"></div>

  <!-- MAIN -->
  <div class="main">

    <!-- HEADER -->
    <div id="header-container"></div>

    <div class="card">
      <div class="action-buttons" style="margin-bottom: 20px;">
        <button id="btnBukaFormMateri" onclick="toggleForm('formMateri')" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">
          ➕ Buat Materi Baru
        </button>
        <button id="btnBukaFormExercise" onclick="toggleForm('formExercise')" style="background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; margin-left: 10px;">
          📝 Buat Latihan Baru
        </button>
      </div>

      <!-- FORM BUAT MATERI BARU -->
      <div id="formMateri" class="card" style="display: none; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fafafa;">
        <h4 style="margin-top: 0;">Form Buat Materi Baru</h4>
        <input type="text" id="newMaterialTitle" placeholder="Judul Sub-Bab / Materi Spesifik (Contoh: Perkalian Aljabar)" style="width:100%; margin-bottom:10px; padding:8px; box-sizing: border-box;"><br><br>
        
        <select id="newMaterialSubject" onchange="populateExistingChapters()" style="width:100%; margin-bottom:10px; padding:8px; box-sizing: border-box;"></select><br><br>

        <div style="border: 1px dashed #aaa; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fff;">
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Bab:</label>
          <select id="newMaterialChapterSelect" style="width:100%; margin-bottom:10px; padding:8px; box-sizing: border-box;" onchange="handleChapterSelectChange()">
            <option value="">-- Pilih Bab Yang Sudah Ada --</option>
          </select>
          <p style="text-align: center; margin: 5px 0; font-size: 12px; color: gray;">atau</p>
          <input type="text" id="newMaterialChapterInput" placeholder="Ketik Nama Bab Baru (Contoh: Bab 1: Aljabar)" style="width:100%; padding:8px; box-sizing: border-box;">
        </div>

        <textarea id="newMaterialContent" placeholder="Isi materi atau link video YouTube / PDF..." style="width:100%; height:100px; margin-bottom:10px; padding:8px; box-sizing: border-box;"></textarea><br>
        
        <button onclick="saveNewMaterial()" style="background-color: #28a745; color:white; padding:8px 15px; border:none; border-radius:4px; cursor:pointer;">Simpan Materi</button>
        <button onclick="toggleForm('formMateri')" style="background-color: #dc3545; color:white; padding:8px 15px; border:none; border-radius:4px; cursor:pointer; margin-left: 5px;">Batal</button>
      </div>

      <!-- FORM BUAT LATIHAN BARU -->
      <div id="formExercise" class="card" style="display: none; border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; background: #fafafa;">
        <h4 style="margin-top: 0;">Form Buat Latihan Baru</h4>
        <label style="font-size: 13px; font-weight: bold;">1. Pilih Mapel:</label>
        <select id="newExerciseSubject" onchange="window.updateExerciseChapters()" style="width:100%; margin-bottom:10px; padding:8px; box-sizing: border-box;"><option value="">-- Pilih Mapel --</option></select><br><br>

        <label style="font-size: 13px; font-weight: bold;">2. Pilih Bab:</label>
        <select id="newExerciseChapter" onchange="window.updateExerciseMaterials()" style="width:100%; margin-bottom:10px; padding:8px; box-sizing: border-box;" disabled><option value="">-- Pilih Bab --</option></select><br><br>

        <label style="font-size: 13px; font-weight: bold;">3. Pilih Materi:</label>
        <select id="newExerciseMaterialId" style="width:100%; margin-bottom:15px; padding:8px; box-sizing: border-box;" disabled><option value="">-- Pilih Materi --</option></select><br><br>

        <label style="font-size: 13px; font-weight: bold;">4. Judul Latihan:</label>
        <input type="text" id="newExerciseTitle" placeholder="Contoh: Kuis Harian 1" style="width:100%; margin-bottom:15px; padding:8px; box-sizing: border-box;"><br>
        
        <button onclick="saveNewExercise()" style="background-color: #007bff; color:white; padding:8px 15px; border:none; border-radius:4px; cursor:pointer;">Simpan Latihan</button>
        <button onclick="toggleForm('formExercise')" style="background-color: #dc3545; color:white; padding:8px 15px; border:none; border-radius:4px; cursor:pointer; margin-left: 5px;">Batal</button>
      </div>

      <!-- MODUL PEMILIHAN BERTAHAP -->
      <h3 style="margin-bottom: 15px;">Modul Pilih Materi & Latihan Kelas</h3>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;" class="grid-2">
        <div>
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Kelas:</label>
          <select id="classSelect" style="width: 100%; padding: 8px; box-sizing: border-box;"></select>
        </div>
        <div>
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Mata Pelajaran:</label>
          <select id="subjectFilter" onchange="onModuleSubjectChange()" style="width: 100%; padding: 8px; box-sizing: border-box;">
            <option value="">-- Pilih Mapel --</option>
          </select>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;" class="grid-2">
        <div>
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Bab:</label>
          <select id="moduleChapterSelect" onchange="onModuleChapterChange()" style="width: 100%; padding: 8px; box-sizing: border-box;" disabled>
            <option value="">-- Pilih Bab --</option>
          </select>
        </div>
        <div>
          <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Sub-Bab / Materi:</label>
          <select id="moduleMaterialSelect" onchange="onModuleMaterialChange()" style="width: 100%; padding: 8px; box-sizing: border-box;" disabled>
            <option value="">-- Pilih Sub-Bab --</option>
          </select>
        </div>
      </div>

      <!-- AREA HASIL MODUL -->
      <div id="moduleResultContainer" class="module-container">
        <p style="text-align: center; color: #777; margin-top: 50px;">Silakan pilih Kelas dan Mata Pelajaran terlebih dahulu di atas.</p>
      </div>

    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="./materials-guru.js"></script>
</body>
</html>
