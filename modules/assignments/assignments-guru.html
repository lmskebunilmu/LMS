<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Siswa - Guru</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">
</head>

<body>

<div class="wrapper">

    <div id="sidebar-container"></div>

    <div class="main">

        <div id="header-container"></div>

        <div class="card">
            <h3>Panel Pengaturan Penugasan & Durasi Siswa</h3>
            <p style="font-size: 13px; color: gray; margin-bottom: 20px;">
                Pilih kelas untuk mengatur status keaktifan, batas waktu (deadline), dan durasi pengerjaan latihan yang telah Anda pilih sebelumnya. Data akan tersimpan permanen.
            </p>

            <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Kelas:</label>
                    <select id="classSelect" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
                </div>
            </div>

            <!-- ID container disesuaikan menjadi exerciseManagementContainer -->
            <div id="exerciseManagementContainer"></div>

        </div>

    </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="./assignments-guru.js"></script>

</body>
</html>
