<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Siswa - Guru</title>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css">

    <style>
      html, body {
          width: 100%;
          min-height: 100%;
          height: auto !important;
          margin: 0;
          padding: 0;
          overflow-x: hidden !important;
          overflow-y: auto !important;
      }
      .wrapper {
          display: flex;
          width: 100%;
          min-height: 100vh !important;
          height: auto !important;
      }
      .main {
          flex: 1;
          min-width: 0;
          min-height: 100vh !important;
          padding-bottom: 60px;
          box-sizing: border-box;
      }
      .card {
          width: 100%;
          box-sizing: border-box;
          margin-bottom: 20px;
      }
      #assignmentGuruList {
          display: flex;
          flex-direction: column;
          gap: 10px;
          margin-top: 15px;
      }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="sidebar-container"></div>
    <div class="main">
        <div id="header-container"></div>

        <div class="card">
            <h3>Panel Penugasan Materi & Latihan Siswa</h3>
            <p style="font-size: 13px; color: gray; margin-bottom: 20px;">
                Klik tombol bab di bawah untuk mengatur penugasan latihan dan batas waktu pengumpulan per kelas.
            </p>

            <div style="display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px;">Pilih Kelas:</label>
                    <select id="classSelect" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom: 5px;">Filter Mata Pelajaran:</label>
                    <select id="subjectFilter" onchange="filterBySubject()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
                        <option value="">Semua Mapel</option>
                    </select>
                </div>
            </div>

            <input 
                type="text"
                id="searchAssignmentGuru"
                placeholder="Cari bab atau materi tugas..."
                oninput="filterAssignmentsGuru()"
                style="width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;"
            >

            <div id="assignmentGuruList" class="material-container"></div>
        </div>
    </div>
</div>

<!-- MODAL POPUP PENUGASAN PER BAB -->
<div id="assignmentModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box;">
  <div style="background: white; width: 100%; max-width: 600px; max-height: 85vh; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
    
    <!-- Modal Header -->
    <div style="padding: 15px 20px; background: #4f46e5; color: white; display: flex; justify-content: space-between; align-items: center;">
      <h3 id="modalAssignmentTitle" style="margin: 0; font-size: 16px;">Pengaturan Bab</h3>
      <button onclick="closeAssignmentModal()" style="background: none; border: none; color: white; font-size: 20px; cursor: pointer;">&times;</button>
    </div>

    <!-- Modal Body -->
    <div id="modalAssignmentBody" style="padding: 20px; overflow-y: auto; flex: 1;"></div>

    <!-- Modal Footer -->
    <div style="padding: 12px 20px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
      <button onclick="saveAssignmentModalData()" style="background: #28a745; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">💾 Simpan Penugasan Bab Ini</button>
      <button onclick="closeAssignmentModal()" style="background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Tutup</button>
    </div>

  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="./assignments-guru.js"></script>
</body>
</html>
