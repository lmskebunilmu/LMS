<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Kebun Ilmu - Pendaftaran & Try Out TKA</title>

<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 16px;
  box-sizing: border-box;
}

.card {
  width: 100%;
  max-width: 400px;
  background: white;
  padding: 28px 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  box-sizing: border-box;
}

/* Brand Header */
.brand-header {
  text-align: center;
  margin-bottom: 20px;
}
.brand-container {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 4px;
}
.brand-logo {
  width: 48px;
  height: 48px;
  object-fit: contain;
}
.brand-name {
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
  letter-spacing: -0.5px;
  text-align: left;
  line-height: 1.1;
}
.brand-name span {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #64748b;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-top: 2px;
}

h2 {
  text-align: center;
  margin-bottom: 16px;
  color: #0f172a;
  font-size: 18px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #cbd5e1;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 14px;
}

.uppercase-input {
  text-transform: uppercase;
}

input:focus, select:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}

.btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  box-sizing: border-box;
  margin-bottom: 10px;
}

.btn:hover {
  background: #1d4ed8;
}

.btn-success { background: #16a34a; }
.btn-success:hover { background: #15803d; }

.btn-whatsapp { background: #25d366; }
.btn-whatsapp:hover { background: #22bf5b; }

.btn-secondary { background: #64748b; }
.btn-secondary:hover { background: #475569; }

/* Switch tab header */
.tab-switcher {
  display: flex;
  background: #f1f5f9;
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 16px;
}
.tab-btn {
  flex: 1;
  padding: 8px;
  border: none;
  background: transparent;
  font-weight: bold;
  font-size: 13px;
  color: #64748b;
  border-radius: 8px;
  cursor: pointer;
}
.tab-btn.active {
  background: white;
  color: #2563eb;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

.hidden { display: none !important; }
</style>
</head>

<body>

<div class="card">

  <div class="brand-header">
    <div class="brand-container">
      <img src="https://zahwan93.github.io/Kebun-Ilmu-Matematika-SMP/logo.png" alt="Logo Kebun Ilmu" class="brand-logo">
      <div class="brand-name">
        Kebun Ilmu
        <span>Portal CBT & Ujian</span>
      </div>
    </div>
  </div>

  <!-- CONTAINER 1: FORM PENDAFTARAN & LOGIN -->
  <div id="authContainer">
    <div class="tab-switcher">
      <button type="button" class="tab-btn active" id="tabRegBtn" onclick="switchTab('register')">Daftar Akun</button>
      <button type="button" class="tab-btn" id="tabLoginBtn" onclick="switchTab('login')">Sudah Punya Akun</button>
    </div>

    <!-- Form Pendaftaran -->
    <form id="registerForm" onsubmit="handleRegister(event)">
      <h2 id="formTitle">Pendaftaran Try Out TKA</h2>
      <input type="text" id="regName" class="uppercase-input" placeholder="Nama Lengkap" oninput="this.value = this.value.toUpperCase()" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>
      <input type="text" id="regSchool" class="uppercase-input" placeholder="Asal Sekolah" oninput="this.value = this.value.toUpperCase()" required>
      <input type="tel" id="regPhone" placeholder="Nomor HP (Contoh: 08123456789)" required>

      <select id="regLevel" required>
        <option value="">Pilih Level</option>
        <option value="SD">SD</option>
        <option value="SMP">SMP</option>
        <option value="SMA">SMA</option>
      </select>

      <button type="submit" class="btn" id="btnRegister">Daftar Sekarang</button>
    </form>

    <!-- Form Login -->
    <form id="loginForm" class="hidden" onsubmit="handleLogin(event)">
      <h2>Login Akun Siswa</h2>
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>

      <button type="submit" class="btn" id="btnLogin">Masuk</button>
    </form>
  </div>

  <!-- CONTAINER 2: DASHBOARD SETELAH LOGIN/DAFTAR -->
  <div id="dashboardContainer" class="hidden">
    <h2 id="welcomeText" style="text-align: left; font-size: 16px; margin-bottom: 8px;">Selamat Datang, Siswa!</h2>
    <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Silakan pilih menu di bawah ini untuk melanjutkan:</p>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <a href="TOTKA.html" class="btn">
        <i class="fa-solid fa-file-lines"></i> Mulai Tryout / Ujian
      </a>
      <a href="https://lmskebunilmu.github.io/LMS/dashboard/student.html" target="_blank" class="btn btn-success">
        <i class="fa-solid fa-graduation-cap"></i> Masuk LMS
      </a>
      <a href="https://wa.me/6285641387872?text=Halo%20Admin%20Kebun%20Ilmu,%20saya%20ingin%20meminta%20pembahasan%20tryout%20dan%20informasi%20pendaftaran%20les." target="_blank" class="btn btn-whatsapp">
        <i class="fa-brands fa-whatsapp"></i> Hubungi Admin (Pembahasan & Les)
      </a>
      <button type="button" class="btn btn-secondary" onclick="handleLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Keluar Akun
      </button>
    </div>
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase/firebase-config.js";
import {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  doc,
  setDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Tab Switcher Function
window.switchTab = function(mode) {
  const regForm = document.getElementById("registerForm");
  const loginForm = document.getElementById("loginForm");
  const tabReg = document.getElementById("tabRegBtn");
  const tabLogin = document.getElementById("tabLoginBtn");

  if(mode === 'register') {
    regForm.classList.remove("hidden");
    loginForm.classList.add("hidden");
    tabReg.classList.add("active");
    tabLogin.classList.remove("active");
  } else {
    loginForm.classList.remove("hidden");
    regForm.classList.add("hidden");
    tabLogin.classList.add("active");
    tabReg.classList.remove("active");
  }
}

// Cek Status Auth Real-time
onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById("authContainer").classList.add("hidden");
    document.getElementById("dashboardContainer").classList.remove("hidden");
    
    try {
      const userSnap = await getDoc(doc(db, "users", user.uid));
      if (userSnap.exists()) {
        const userData = userSnap.data();
        document.getElementById("welcomeTextinnerText") = `Selamat Datang, ${userData.name || user.email}!`;
        // Perbaikan kecil pada properti innerText
        document.getElementById("welcomeText").innerText = `Selamat Datang, ${userData.name || user.email}!`;
      } else {
        document.getElementById("welcomeText").innerText = `Selamat Datang, ${user.email}!`;
      }
    } catch(e) {
      document.getElementById("welcomeText").innerText = `Selamat Datang!`;
    }
  } else {
    document.getElementById("authContainer").classList.remove("hidden");
    document.getElementById("dashboardContainer").classList.add("hidden");
  }
});

// Fungsi Registrasi
window.handleRegister = async function(event){
  event.preventDefault();

  let name = document.getElementById("regName").value.trim();
  let email = document.getElementById("regEmail").value.trim();
  let password = document.getElementById("regPassword").value;
  let school = document.getElementById("regSchool").value.trim();
  let phone = document.getElementById("regPhone").value.trim();
  let level = document.getElementById("regLevel").value;
  let btnRegister = document.getElementById("btnRegister");

  if(!name || !email || !password || !school || !phone || !level){
    alert("Semua kolom wajib diisi!");
    return;
  }

  try {
    btnRegister.disabled = true;
    btnRegister.innerText = "Memproses...";

    let userCredential = await createUserWithEmailAndPassword(auth, email, password);
    let uid = userCredential.user.uid;

    await setDoc(doc(db, "users", uid), {
      uid,
      name,
      email,
      school,
      phone,
      role: "student",
      level,
      createdAt: new Date()
    });

    alert("Pendaftaran berhasil!");
  }
  catch(error){
    alert("Pendaftaran gagal: " + error.message);
  } finally {
    btnRegister.disabled = false;
    btnRegister.innerText = "Daftar Sekarang";
  }
}

// Fungsi Login Langsung
window.handleLogin = async function(event){
  event.preventDefault();

  let email = document.getElementById("loginEmail").value.trim();
  let password = document.getElementById("loginPassword").value;
  let btnLogin = document.getElementById("btnLogin");

  try {
    btnLogin.disabled = true;
    btnLogin.innerText = "Masuk...";
    await signInWithEmailAndPassword(auth, email, password);
  } catch(error){
    alert("Login gagal: " + error.message);
  } finally {
    btnLogin.disabled = false;
    btnLogin.innerText = "Masuk";
  }
}

// Fungsi Logout
window.handleLogout = async function(){
  try {
    await signOut(auth);
  } catch(error) {
    alert("Gagal keluar akun.");
  }
}
</script>

</body>
</html>
