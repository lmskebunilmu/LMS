<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pendaftaran Try Out TKA</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f1f5f9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  width:380px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#0f172a;
}

input, select{
  width:100%;
  padding:12px;
  margin-bottom:14px;
  border:1px solid #cbd5e1;
  border-radius:10px;
  box-sizing:border-box;
  font-size:14px;
}

input:focus, select:focus{
  outline:none;
  border-color:#2563eb;
  box-shadow:0 0 0 3px rgba(37,99,235,0.1);
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  transition:background 0.2s;
}

button:hover{
  background:#1d4ed8;
}
</style>
</head>

<body>

<div class="card">

  <h2>Pendaftaran Try Out TKA</h2>

  <form id="registerForm" onsubmit="register(event)">
    <input type="text" id="name" placeholder="Nama Lengkap" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <input type="text" id="school" placeholder="Asal Sekolah" required>
    <input type="tel" id="phone" placeholder="Nomor HP (Contoh: 08123456789)" required>

    <select id="level" required>
      <option value="">Pilih Level</option>
      <option value="SD">SD</option>
      <option value="SMP">SMP</option>
      <option value="SMA">SMA</option>
    </select>

    <button type="submit">
      Daftar
    </button>
  </form>

</div>

<script type="module">

import { auth, db } from "./firebase/firebase-config.js";

import {
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

async function register(event){
  event.preventDefault();

  let name = document.getElementById("name").value.trim();
  let email = document.getElementById("email").value.trim();
  let password = document.getElementById("password").value;
  let school = document.getElementById("school").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let level = document.getElementById("level").value;

  // Pengecekan ganda agar memastikan tidak ada yang kosong
  if(!name || !email || !password || !school || !phone || !level){
    alert("Semua kolom wajib diisi!");
    return;
  }

  try {
    let userCredential =
    await createUserWithEmailAndPassword(
      auth,
      email,
      password
    );

    let uid = userCredential.user.uid;

    await setDoc(
      doc(db, "users", uid),
      {
        uid,
        name,
        email,
        school,
        phone,
        role: "student",
        level,
        createdAt: new Date()
      }
    );

    alert("Pendaftaran berhasil!");
    window.location.href = "login.html";

  }
  catch(error){
    alert(error.message);
  }

}
window.register = register;

</script>

</body>
</html>
