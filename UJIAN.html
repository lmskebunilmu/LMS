<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Ujian LMS Kebun Ilmu</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
            color: #1e293b;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .hidden {
            display: none !important;
        }

        .badge {
            display: inline-block;
            padding: 6px 16px;
            background-color: #e0e7ff;
            color: #4338ca;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 50px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        h1, h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn-primary {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff;
            box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px -5px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }

        .btn-secondary {
            background-color: #f8fafc;
            color: #334155;
            border: 2px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .svg-icon {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .user-info {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            color: #475569;
        }

        footer {
            margin-top: 32px;
            font-size: 0.8rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">LMS KEBUN ILMU</span>

        <!-- TAMPILAN LOGIN (DISEMBUNYIKAN) -->
        <div id="loginSection" class="hidden">
            <h2>Login LMS</h2>
            <p class="subtitle">Masukkan akun Anda untuk mengakses portal ujian.</p>
        </div>

        <!-- TAMPILAN PORTAL (LANGSUNG MUNCUL) -->
        <div id="portalSection">
            <h1>Portal Ujian Online</h1>
            <p class="subtitle">Pilih menu di bawah ini untuk memulai sesi ujian atau melihat hasil penilaian Anda.</p>

            <div class="user-info">
                Status: <strong>Pengunjung / Tanpa Login</strong>
            </div>

            <div class="button-container">
                <a href="https://lmskebunilmu.github.io/LMS/UJIAN.html" class="btn btn-primary">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M14.75 12l-5.25-3.03v6.06L14.75 12z"></path>
                        <circle cx="12" cy="12" r="10"></circle>
                    </svg>
                    Mulai Ujian
                </a>

                <a href="https://lmskebunilmu.github.io/LMS/HASIL%20UJIAN.html" class="btn btn-secondary">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Lihat Hasil Ujian
                </a>
            </div>
        </div>

        <footer>
            &copy; LMS Kebun Ilmu. All rights reserved.
        </footer>
    </div>

</body>
</html>
